[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-tuning"
version = "0.1.0"
description = "Federated 'swarm' tuning: gradient accumulation over HTTP across a swarm of free instances."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "safetensors>=0.4",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swarm-worker = "worker.run_worker:main"
swarm-server = "server.app:main"

[tool.setuptools]
packages = ["swarm", "server", "worker"]

[tool.setuptools.package-data]
swarm = ["*.txt"]
